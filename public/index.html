<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>domlet counter</title>
  <style>
    :root { --bg:#0f1220; --fg:#e7e9ee; --accent:#7aa2ff; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; min-height: 100svh;
      background: var(--bg); color: var(--fg);
      font: 16px/1.2 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
    }
    .wrap { display: grid; place-items: center; gap: 20px; text-align: center; }
    .value { font-size: clamp(48px, 12vw, 96px); font-weight: 900; letter-spacing: 1px; }
    .btn {
      appearance: none; border: 0; padding: 12px 18px; border-radius: 12px; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
      box-shadow: 0 6px 24px #0006;
    }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
